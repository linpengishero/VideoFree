tem(key)||'{}');a[id]={x,y};localStorage.setItem(key,JSON.stringify(a))}function drag(e){let d;e.onpointerdown=v=>{if(v.target.closest('video,audio,button'))return;d={x:v.clientX,y:v.clientY,l:+e.style.left.slice(0,-2),t:+e.style.top.slice(0,-2)};e.setPointerCapture(v.pointerId);e.style.zIndex=++z};e.onpointermove=v=>{if(!d)return;let b=$('canvas').getBoundingClientRect();e.style.left=Math.max(8,Math.min(b.width-e.offsetWidth-8,d.l+v.clientX-d.x))+'px';e.style.top=Math.max(8,Math.min(b.height-e.offsetHeight-120,d.t+v.clientY-d.y))+'px'};e.onpointerup=()=>{if(d)save(e.id,+e.style.left.slice(0,-2),+e.style.top.slice(0,-2));d=null}}function update(e,j){e.querySelector('.card-media').innerHTML=['queued','running'].includes(j.status)?'<div><div class="spin"></div><small>生成中</small></div>':j.status==='completed'?media(j):`<small style="padding:12px;color:#f28c8c">${j.error||'任务失败'}</small>`;e.querySelector('.state').textContent=j.status}function add(j){$('empty').classList.add('hide');let e=document.createElement('article'),p=saved(j.job_id,$('stage').children.length);e.id=j.job_id;e.className='card';e.style.left=p.x+'px';e.style.top=p.y+'px';e.innerHTML='<div class="card-media"></div><div class="foot"><span>'+j.job_id+'</span><span class="state"></span></div>';$('stage').append(e);drag(e);update(e,j);poll(j.job_id)}async function poll(id){try{let j=await fetch('/v1/jobs/'+id).then(r=>r.json()),e=$(id);if(e)update(e,j);if(['queued','running'].includes(j.status))setTimeout(()=>poll(id),1800)}catch(e){}}async function submitJob(){let p=$('prompt').value.trim();if(!p)return;let imgs=await Promise.all(files.filter(f=>f.type.startsWith('image/')).map(read)),videos=await Promise.all(files.filter(f=>f.type.startsWith('video/')).map(read));if(type==='video'&&mode==='image_to_video'&&!imgs.length)return alert('请上传首帧');if(type==='video'&&mode==='first_last_frame'&&imgs.length<2)return alert('请上传首帧和尾帧');if(type==='video'&&mode==='motion_imitation'&&(!imgs.length||!videos.length))ret function addFiles(newFiles){for(const file of newFiles){const isImage=file.type.startsWith('image/'),isAudio=file.type.startsWith('audio/'),isVideo=file.type.startsWith('video/');const imageCount=files.filter(item=>item.type.startsWith('image/')).length,audioCount=files.filter(item=>item.type.startsWith('audio/')).length,videoCount=files.filter(item=>item.type.startsWith('video/')).length;if(isImage&&imageCount<9)files.push(file);if(isAudio&&audioCount<3)files.push(file);if(isVideo&&videoCount<3)files.push(file)}}
